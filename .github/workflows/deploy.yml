name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Test Back-End (NestJS)
        run: |
          cd back
          npm ci
          npm run test

      - name: Lint Front-End (Next.js)
        run: |
          cd front
          npm ci
          npm run lint

  build-and-push:
    name: Build & Push Docker Images (GHCR)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Back-End Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/homeez-back:${{ github.sha }}
            ghcr.io/${{ github.repository }}/homeez-back:latest

      - name: Build & Push Front-End Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/homeez-front:${{ github.sha }}
            ghcr.io/${{ github.repository }}/homeez-front:latest

